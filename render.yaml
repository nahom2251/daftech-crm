services:
  # ---------- Backend API (.NET via Docker) ----------
  - type: web
    name: daftech-crm-api
    runtime: docker
    rootDir: api/DaftechCrm
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

  # ---------- Frontend (Angular - Static) ----------
  - type: web
    name: daftech-crm-web
    runtime: static
    rootDir: ng/daftech-crm
    buildCommand: npm run build
    staticPublishPath: dist/daftech-crm/browser
    plan: free
    routes:
      - type: rewrite
        source: /*
        destination: /index.html