services:
  # ---------- Backend API (.NET via Docker) ----------
  - type: web
    name: daftech-crm-api2
    runtime: docker
    rootDir: api/DaftechCrm
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DATABASE_URL
        fromDatabase:
          name: daftech-crm-db
          property: connectionString

  # ---------- Frontend (Angular via Node.js + Express) ----------
  - type: web
    name: daftech-crm-web
    runtime: node
    rootDir: ng/daftech-crm
    buildCommand: npm install && npm run build:prod
    startCommand: node server.js
    plan: free
    envVars:
      - key: API_BASE_URL
        value: https://daftech-crm-api2.onrender.com/api
      - key: NODE_VERSION
        value: 20.0.0

databases:
  - name: daftech-crm-db
    databaseName: daftech_crm
    user: daftech
    plan: free
    region: oregon